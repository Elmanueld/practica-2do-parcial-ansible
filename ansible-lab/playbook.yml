---
- name: Administrar los servidores Ubuntu en Docker
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "Servidor: {{ inventory_hostname }}"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear el directorio de demostracion
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: "0755"

    - name: Crear info.txt con informacion del servidor
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}
        mode: "0644"

    - name: Crear subdirectorios de trabajo
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logs
        - backup
        - config

    - name: Informar cuando el sistema operativo es Ubuntu
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ejecuta Ubuntu."
      when: ansible_distribution == "Ubuntu"
